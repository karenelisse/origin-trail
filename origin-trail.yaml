openapi: 3.1.0
info:
  title: Origin Trail API
  version: 0.1.0
  description: Product provenance lookup API.
servers:
  - url: http://localhost:8008
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API is healthy
  /api/products/resolve:
    post:
      summary: Resolve product provenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                brand:
                  type: string
      responses:
        "200":
          description: Product provenance result
        "400":
          description: Invalid request
        "500":
          description: Unable to resolve product origin
